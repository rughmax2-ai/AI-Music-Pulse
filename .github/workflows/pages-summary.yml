name: Build Running Summary for Pages

on:
  schedule:
    # Runs after the daily crawl window so it can summarize the latest archive.
    - cron: "30 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build running summary
        run: python scripts/build_pages_summary.py

      - name: Commit and push summary artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/running-summary.json docs/index.html docs/summary.json
          if git diff --cached --quiet; then
            echo "No summary changes to commit."
          else
            git commit -m "chore: refresh running summary $(date -u +%F)"
            git push
          fi
