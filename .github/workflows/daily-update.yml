name: Daily AI Music Update

on:
  schedule:
    # Every day at 06:15 UTC (offset from the top of the hour to avoid
    # GitHub's peak cron congestion, which can delay or skip runs)
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Reddit data
        run: python scripts/fetch_reddit.py

      - name: Fetch Discord data
        # No-ops (exit 0) when DISCORD_BOT_TOKEN is unset. Phase 4 will
        # implement real channel reads once secrets + channel IDs exist.
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
        run: python scripts/fetch_discord.py

      - name: Sync posts to Supabase
        # Best-effort: the core digest (fetch -> README -> commit) must keep
        # working even if Supabase secrets are missing or the sync fails for
        # any other reason. Check this step's own status in the Actions tab
        # to notice when it's failing silently.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_to_supabase.py

      - name: Update README digest
        run: python scripts/update_readme.py

      - name: Build static archive site
        run: python scripts/build_site.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md site/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily AI music digest $(date -u +%F)"
            git push
          fi
